        async function initFirebase() {
            try {
                if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                    throw new Error('Firebase config missing, using fallback');
                }
                const firebaseConfig = typeof __firebase_config === 'string'
                    ? JSON.parse(__firebase_config)
                    : __firebase_config;

                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Authenticate BEFORE any Firestore queries (Rule 3)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                currentUser = auth.currentUser;
                if (!currentUser) {
                    await new Promise((resolve) => {
                        const unsub = onAuthStateChanged(auth, (user) => {
                            if (user) {
                                currentUser = user;
                                unsub();
                                resolve();
                            }
                        });
                    });
                }

                useMemoryFallback = false;
                updateSyncStatusUI(true, 'ซิงค์ออนไลน์');
                setupRealtimeShopListeners();
            } catch (err) {
                console.warn("Running in standalone memory mode:", err);
                useMemoryFallback = true;
                updateSyncStatusUI(false, 'โหมดในเครื่อง');
                renderRecentMembers();
            }
        }

        // Initialize App on Load (Await Firebase Auth before handling URL params)
        window.addEventListener('DOMContentLoaded', async () => {
            renderMenuGrid();

            // Restore shop login state if refreshed on shop device
            if (isShopAuthenticated) {
                document.getElementById('shop-login-card').classList.add('hidden');
                document.getElementById('shop-dashboard').classList.remove('hidden');
            }

            // Handle URL Parameters (?phone=08xxxxxxxx or ?register=1)
            const params = new URLSearchParams(window.location.search);
            const paramPhone = (params.get('phone') || '').replace(/\D/g, '');
            const isRegister = params.get('register') === '1';

            if (paramPhone.length >= 9) {
                switchAppMode('customer');
                await loadOrRegisterCustomer(paramPhone);
            } else if (isRegister) {
                switchAppMode('customer');
                setTimeout(() => document.getElementById('customer-phone-input')?.focus(), 200);
            }
        });
